name: Tag on Version-Bump Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          # Use the PAT, not the automatic GITHUB_TOKEN. `actions/checkout`
          # persists this token for `git push`, and events caused by
          # GITHUB_TOKEN never trigger further workflow runs (so dist.yml
          # would never fire).
          token: ${{ secrets.GH_PAT }}

      - name: Detect version-bump PR
        id: detect
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          TITLE="${{ github.event.pull_request.title }}"

          if [[ "$BRANCH" == "chore/monthly-version-bump" ]] || [[ "$TITLE" == *"bump version"* ]]; then
            echo "is_version_bump=true" >> "$GITHUB_OUTPUT"
            echo "✅ Detected version-bump PR — proceeding to tag."
          else
            echo "is_version_bump=false" >> "$GITHUB_OUTPUT"
            echo "Is not a version-bump PR — skipping tag creation."
          fi

      - name: Extract new version
        if: steps.detect.outputs.is_version_bump == 'true'
        id: version
        run: |
          NEW_TAG=$(grep -oP 'leech@\Kv[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1)

          if [ -z "$NEW_TAG" ]; then
            echo "❌ Could not extract version from README.md"
            exit 1
          fi

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "📦 Extracted version: $NEW_TAG"

      - name: Create Git tag
        if: steps.detect.outputs.is_version_bump == 'true'
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"

          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "⚠️ Tag $NEW_TAG already exists — skipping creation."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

          echo "✅ Tag $NEW_TAG created and pushed."
